#
# CI runs on GPU-less runners and is expected to stay green there (PLAN.md section 8). That is
# honest rather than a compromise: the compiler passes are hardware-independent, so the CPU
# backend genuinely exercises them. CUDA tests are marked `cuda` and run locally.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Two of 32 cores would be wasteful, but GitHub runners have far less RAM per core than the
  # development machine. Linking with sanitizers is the memory-hungry step.
  CMAKE_BUILD_PARALLEL_LEVEL: 4

jobs:
  lint-python:
    name: Lint (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned tooling
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-dev.txt
      - name: ruff check
        run: ruff check .
      - name: ruff format
        run: ruff format --check .
      - name: Install package for type checking
        run: pip install -e . --no-build-isolation
      - name: mypy
        run: mypy

  lint-cpp:
    name: Lint (C++)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned tooling
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-dev.txt
      - name: clang-format
        run: |
          files=$(find csrc tests/cpp -name '*.cpp' -o -name '*.h' -o -name '*.cu' \
                  | grep -v '^csrc/generated/' | sort)
          clang-format --dry-run --Werror $files
      - name: Configure for clang-tidy
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DTESSERA_BUILD_PYTHON=ON
      - name: clang-tidy
        run: |
          status=0
          for f in $(find csrc tests/cpp -name '*.cpp' | grep -v '^csrc/generated/' | sort); do
            clang-tidy -p build "$f" || status=1
          done
          exit $status

  build-and-test:
    name: Build and test (${{ matrix.build_type }}, Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # The oldest supported interpreter, to catch use of newer syntax than requires-python
          # declares.
          - python: "3.10"
            build_type: RelWithDebInfo
          - python: "3.12"
            build_type: Debug
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install pinned tooling
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-dev.txt
      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DTESSERA_BUILD_TESTS=ON \
            -DTESSERA_BUILD_PYTHON=ON \
            -DTESSERA_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build build
      - name: C++ tests
        run: ctest --test-dir build --output-on-failure
      - name: Install package
        run: pip install -e . --no-build-isolation
      - name: Python tests
        # CUDA-marked tests need a GPU, which these runners do not have.
        run: pytest -m "not cuda"

  sanitizers:
    name: Sanitizers (ASan + UBSan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned tooling
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-dev.txt
      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DTESSERA_BUILD_TESTS=ON \
            -DTESSERA_BUILD_PYTHON=OFF \
            -DTESSERA_SANITIZER=address,undefined
      - name: Build
        run: cmake --build build
      - name: C++ tests under sanitizers
        env:
          # halt_on_error makes the first report fail the job rather than being buried in output.
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: ctest --test-dir build --output-on-failure
