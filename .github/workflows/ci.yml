#
# CI runs on runners without a GPU. The compiler passes are hardware-independent, so the CPU
# backend exercises them; CUDA tests are marked `cuda` and run locally.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Two of 32 cores would be wasteful, but GitHub runners have far less RAM per core than the
  # development machine. Linking with sanitizers is the memory-hungry step.
  CMAKE_BUILD_PARALLEL_LEVEL: 4

jobs:
  lint-python:
    name: Lint (Python, workflows)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/install-tooling
      - name: ruff check
        run: ruff check .
      - name: ruff format
        run: ruff format --check .
      - name: Install package for type checking
        run: pip install -e . --no-build-isolation
      - name: mypy
        run: mypy
      - name: actionlint
        run: actionlint

  lint-cpp:
    name: Lint (C++)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/install-tooling
      - name: clang-format
        run: python tools/lint_cpp.py --format
      - name: Configure for clang-tidy
        run: cmake --preset dev
      - name: clang-tidy
        run: python tools/lint_cpp.py --tidy --build-dir build/dev

  build-and-test:
    name: Build and test (${{ matrix.preset }}, Python ${{ matrix.python }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          # The oldest supported interpreter, to catch use of newer syntax than requires-python
          # declares.
          - python: "3.10"
            preset: release
          - python: "3.12"
            preset: dev
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/install-tooling
        with:
          python-version: ${{ matrix.python }}
      - name: Configure
        run: cmake --preset ${{ matrix.preset }}
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}
      - name: C++ tests
        run: ctest --preset ${{ matrix.preset }}
      - name: Install package
        run: pip install -e . --no-build-isolation
      - name: Python tests
        # CUDA-marked tests need a GPU, which these runners do not have.
        run: pytest -m "not cuda"

  sanitizers:
    name: Sanitizers (ASan + UBSan)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/install-tooling
      - name: Configure
        run: cmake --preset sanitizers
      - name: Build
        run: cmake --build --preset sanitizers
      - name: C++ tests under sanitizers
        env:
          # halt_on_error makes the first report fail the job rather than being buried in output.
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: ctest --preset sanitizers

  coverage:
    name: Coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/install-tooling
      - name: C++ coverage
        run: |
          cmake --preset coverage
          cmake --build --preset coverage
          ctest --preset coverage
          gcovr --root . --filter csrc/ --print-summary --xml build/coverage/cpp-coverage.xml build/coverage
      - name: Install package
        run: pip install -e . --no-build-isolation
      - name: Python coverage
        run: pytest -m "not cuda" --cov --cov-report=term --cov-report=xml:build/coverage/python-coverage.xml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage
          path: build/coverage/*-coverage.xml
