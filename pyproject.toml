[build-system]
requires = ["scikit-build-core>=0.10", "pybind11>=2.12"]
build-backend = "scikit_build_core.build"

[project]
name = "tessiq"
description = "A from-scratch PyTorch accelerator backend: device, graph compiler, and kernels"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Logeswaran123", email = "loges.siva14@gmail.com" }]
keywords = ["pytorch", "compiler", "cuda", "accelerator", "backend", "fusion"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: C++",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Compilers",
]

# The version is read from CMakeLists.txt, so the package, the native module and the build agree.
dynamic = ["version"]

# The extension module links libtorch, so torch is required to import tessiq. The C++ core
# (support, runtime, IR and passes) builds and tests without torch or a GPU.
dependencies = ["torch>=2.6"]

[project.optional-dependencies]
dev = [
  "mypy>=1.11",
  "pre-commit>=3.8",
  "pytest>=8.0",
  "pytest-benchmark>=4.0",
  "ruff>=0.6",
]

# Discovered by torch._dynamo, which loads it the first time a compile asks for backend="tessiq".
# It means `torch.compile(model, backend="tessiq")` works without an `import tessiq` beforehand.
[project.entry-points."torch_dynamo_backends"]
tessiq = "tessiq.backend:compile_graph"

[project.urls]
Homepage = "https://github.com/Logeswaran123/tessiq"
Repository = "https://github.com/Logeswaran123/tessiq"

[tool.scikit-build]
minimum-version = "0.10"
build-dir = "build/{wheel_tag}"
wheel.packages = ["python/tessiq"]
cmake.version = ">=3.26"
cmake.build-type = "RelWithDebInfo"

[tool.scikit-build.cmake.define]
# The C++ test suite is not part of a wheel build; it is built explicitly from a CMake configure.
TESSIQ_BUILD_TESTS = "OFF"

[tool.scikit-build.metadata.version]
provider = "scikit_build_core.metadata.regex"
input = "CMakeLists.txt"
regex = '(?sm)project\s*\(\s*tessiq.*?VERSION\s+(?P<value>[0-9]+\.[0-9]+\.[0-9]+)'

# --- Tooling -------------------------------------------------------------------------------------

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests/python"]
# -ra reports the reason for every non-passing test; --strict-markers makes a typo'd marker an
# error rather than a test that silently never runs.
addopts = "-ra --strict-markers --strict-config"
markers = [
  "cuda: requires an NVIDIA GPU; deselected in CI with -m 'not cuda'",
  "slow: takes more than a second",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["python", "tests/python", "tools"]
# Build trees contain vendored third-party sources, such as googletest's Python helpers. Matched
# by pattern, because build directories get suffixes (build-asan, build-cuda).
extend-exclude = ["build*", "_skbuild*", "**/_deps/**", "csrc/generated"]

[tool.ruff.lint]
select = [
  "E", "W",   # pycodestyle
  "F",        # pyflakes
  "I",        # import sorting
  "N",        # naming
  "UP",       # pyupgrade
  "B",        # bugbear
  "A",        # shadowing builtins
  "C4",       # comprehensions
  "PT",       # pytest style
  "RET",      # return simplification
  "SIM",      # simplification
  "ARG",      # unused arguments
  "PTH",      # pathlib over os.path
  "ERA",      # commented-out code
  "RUF",
]
ignore = [
  "E501",  # line length is enforced by the formatter, not the linter
]

[tool.ruff.lint.per-file-ignores]
# Tests reach into private internals deliberately, to exercise the error-translation boundary.
"tests/python/*" = ["SLF001"]
# `_C` is the established name for a native extension module across the Python ecosystem.
"python/tessiq/_C.pyi" = ["N999"]

[tool.mypy]
# The development interpreter rather than the 3.10 floor: dependencies ship stubs in 3.12 syntax,
# which mypy cannot parse when assuming 3.10. The floor is enforced by ruff's target-version and by
# CI running the tests on 3.10.
python_version = "3.12"
files = ["python/tessiq", "tests/python"]
strict = true
# The native module is typed by a hand-written stub (python/tessiq/_C.pyi).
ignore_missing_imports = false
warn_unreachable = true
