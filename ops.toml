# --- rounding -----------------------------------------------------------------------------------

[[op]]
name = "floor"
aten = ["aten.floor.default"]
category = "elementwise"
arity = 1
expression = "floor($0)"
kernel = true

[[op]]
name = "ceil"
aten = ["aten.ceil.default"]
category = "elementwise"
arity = 1
expression = "ceil($0)"
kernel = true

[[op]]
name = "trunc"
aten = ["aten.trunc.default"]
category = "elementwise"
arity = 1
expression = "trunc($0)"
kernel = true

# rint, not round. C's round() sends a half away from zero and torch sends it to the nearest even
# number, so round(0.5) is 1 there and 0 here, and rint is what agrees.
[[op]]
name = "round"
aten = ["aten.round.default"]
category = "elementwise"
arity = 1
expression = "rint($0)"
kernel = true

# --- error function -----------------------------------------------------------------------------

[[op]]
name = "erf"
aten = ["aten.erf.default"]
category = "elementwise"
arity = 1
expression = "erf($0)"
kernel = true

[[op]]
name = "erfc"
aten = ["aten.erfc.default"]
category = "elementwise"
arity = 1
expression = "erfc($0)"
kernel = true

# The exact GELU, x * Phi(x), written with erf as torch writes it. The tanh approximation carries
# approximate = "tanh", an argument this does not read, so it stays on the host.
[[op]]
name = "gelu"
aten = ["aten.gelu.default"]
category = "elementwise"
arity = 1
expression = "(scalar_t(0.5) * $0 * (scalar_t(1) + erf($0 * scalar_t(0.70710678118654752440))))"
kernel = true

# --- reductions ---------------------------------------------------------------------------------
#
# A reduction reads many positions to write one, so it has no expression and cannot join an
# elementwise loop. Which positions it reads comes from the node rather than from this table: the
# dimensions are an attribute, and so is keepdim, because the same operation reduces different axes
# in different graphs.
#
# Both spellings of sum and mean are one row. torch normalises torch.sum(x) to the dim_IntList form
# with an empty dimension list, and an absent list means the same thing, so one rule covers both.

[[op]]
name = "sum"
aten = ["aten.sum.dim_IntList", "aten.sum.default"]
category = "reduction"
arity = 1
kernel = true

[[op]]
name = "mean"
aten = ["aten.mean.dim", "aten.mean.default"]
category = "reduction"
arity = 1
kernel = true

# amax and amin, not max and min. The max.dim form returns the values and their positions as two
# results, which is a different shape of answer and not what a reduction rule describes.
[[op]]
name = "amax"
aten = ["aten.amax.default"]
category = "reduction"
arity = 1
kernel = true

[[op]]
name = "amin"
aten = ["aten.amin.default"]
category = "reduction"
arity = 1
kernel = true

# --- movement -----------------------------------------------------------------------------------
#
# These rearrange indices and compute nothing. On a tessiq tensor they are metadata: as_strided,
# view and _reshape_alias are registered on the device, and everything here is written in terms of
# one of them, so the result shares its input's storage. They have no expression and no generated
# code.
#
# A copy is its own category. A movement operation returns a view of the same storage, while a copy
# makes a pass over the data into storage of its own. Clustering leaves a unit of nothing but views
# on the host, and places a unit with a copy in it.
#
# `aten::clone` is registered against the dispatch key, over a kernel that steps through whatever
# layout it is handed, so there is nothing to generate for the row below.

[[op]]
name = "view"
aten = ["aten.view.default", "aten._unsafe_view.default"]
category = "movement"
arity = 1
kernel = true

[[op]]
name = "reshape"
aten = ["aten.reshape.default", "aten._reshape_alias.default"]
category = "movement"
arity = 1
kernel = true

[[op]]
name = "permute"
aten = ["aten.permute.default"]
category = "movement"
arity = 1
kernel = true

[[op]]
name = "transpose"
aten = ["aten.transpose.int"]
category = "movement"
arity = 1
kernel = true

[[op]]
name = "expand"
aten = ["aten.expand.default"]
category = "movement"
arity = 1
kernel = true

[[op]]
name = "squeeze"
aten = ["aten.squeeze.dim", "aten.squeeze.dims", "aten.squeeze.default"]
category = "movement"
arity = 1
kernel = true

[[op]]
name = "unsqueeze"
aten = ["aten.unsqueeze.default"]
category = "movement"
arity = 1
kernel = true

[[op]]
name = "slice"
aten = ["aten.slice.Tensor"]
category = "movement"
arity = 1
kernel = true

[[op]]
name = "select"
aten = ["aten.select.int"]
category = "movement"
arity = 1
kernel = true

# --- matmul -------------------------------------------------------------------------------------

# Reads positions other than the one it writes, so it never joins an elementwise loop.
[[op]]
name = "mm"
aten = ["aten.mm.default"]
category = "matmul"
arity = 2
kernel = true
# cuBLAS is called for float32 only; other types stay on the host.
dtypes = ["f32"]

# The form nn.Linear produces: a bias row added to every row of the product. Its weight arrives
# transposed, which BLAS takes as a flag rather than a copy.
[[op]]
name = "addmm"
aten = ["aten.addmm.default"]
category = "matmul"
arity = 3
kernel = true
dtypes = ["f32"]

[[op]]
name = "bmm"
aten = ["aten.bmm.default"]
category = "matmul"
arity = 2
kernel = true
dtypes = ["f32"]

[[op]]
name = "clone"
aten = ["aten.clone.default"]
category = "copy"
arity = 1
kernel = true

# A cuDNN call, the way a matmul is a cuBLAS one. cuDNN picks the algorithm for the shapes and the
# card.
[[op]]
name = "convolution"
aten = ["aten.convolution.default"]
category = "convolution"
arity = 3
kernel = true
# float32 only, like the matmuls.
dtypes = ["f32"]
