# Operations tessiq knows about.
#
# One row per operation, so whether it is elementwise, how many arguments it takes, what it
# computes and whether a kernel exists all come from one place.
#
# `tools/gen_ops.py` turns this into the C++ table and into docs/op_coverage.md. Both are checked
# in, and a test fails if regenerating would change them.
#
# Fields:
#   name        the short spelling, used in hand-written IR
#   aten        the spellings torch emits, which is what an imported graph carries
#   category    elementwise | reduction | movement | matmul | copy | convolution. Decides what a
#               pass may do with it, not whether it runs
#   arity       arguments including constants that arrived as attributes
#   expression  the scalar computation, $0 and $1 for the arguments. Elementwise only
#   kernel      whether the backend can run it. An operation without one falls back to the host
#   dtypes      optional: the element types it runs on, such as ["f32"]. Absent means every type
#
# TOML because the parser is in the standard library from 3.11. On 3.10 it is tomli, the same
# parser, listed in requirements-dev.txt and needed only to regenerate.

[[op]]
name = "abs"
aten = ["aten.abs.default"]
category = "elementwise"
arity = 1
expression = "fabs($0)"
kernel = true

[[op]]
name = "add"
aten = ["aten.add.Tensor", "aten.add.Scalar"]
category = "elementwise"
arity = 2
expression = "($0 + $1)"
kernel = true

[[op]]
name = "div"
aten = ["aten.div.Tensor", "aten.div.Scalar"]
category = "elementwise"
arity = 2
expression = "($0 / $1)"
kernel = true

[[op]]
name = "mul"
aten = ["aten.mul.Tensor", "aten.mul.Scalar"]
category = "elementwise"
arity = 2
expression = "($0 * $1)"
kernel = true

[[op]]
name = "neg"
aten = ["aten.neg.default"]
category = "elementwise"
arity = 1
expression = "(-$0)"
kernel = true

[[op]]
name = "relu"
aten = ["aten.relu.default"]
category = "elementwise"
arity = 1
expression = "($0 > scalar_t(0) || $0 != $0 ? $0 : scalar_t(0))"
kernel = true

[[op]]
name = "sigmoid"
aten = ["aten.sigmoid.default"]
category = "elementwise"
arity = 1
expression = "(scalar_t(1) / (scalar_t(1) + exp(-$0)))"
kernel = true

[[op]]
name = "sqrt"
aten = ["aten.sqrt.default"]
category = "elementwise"
arity = 1
expression = "sqrt($0)"
kernel = true

[[op]]
name = "sub"
aten = ["aten.sub.Tensor", "aten.sub.Scalar"]
category = "elementwise"
arity = 2
expression = "($0 - $1)"
kernel = true

[[op]]
name = "tanh"
aten = ["aten.tanh.default"]
category = "elementwise"
arity = 1
expression = "tanh($0)"
kernel = true


# --- exponentials and logarithms ----------------------------------------------------------------

[[op]]
name = "exp"
aten = ["aten.exp.default"]
category = "elementwise"
arity = 1
expression = "exp($0)"
kernel = true

# expm1 and log1p exist because exp(x)-1 and log(1+x) lose most of their precision near zero.
# Emitting them as the composite would be correct on paper and wrong in the digits that matter.
[[op]]
name = "expm1"
aten = ["aten.expm1.default"]
category = "elementwise"
arity = 1
expression = "expm1($0)"
kernel = true

[[op]]
name = "log"
aten = ["aten.log.default"]
category = "elementwise"
arity = 1
expression = "log($0)"
kernel = true

[[op]]
name = "log1p"
aten = ["aten.log1p.default"]
category = "elementwise"
arity = 1
expression = "log1p($0)"
kernel = true

[[op]]
name = "log2"
aten = ["aten.log2.default"]
category = "elementwise"
arity = 1
expression = "log2($0)"
kernel = true

[[op]]
name = "log10"
aten = ["aten.log10.default"]
category = "elementwise"
arity = 1
expression = "log10($0)"
kernel = true

[[op]]
name = "pow"
aten = ["aten.pow.Tensor_Scalar"]
category = "elementwise"
arity = 2
expression = "pow($0, $1)"
kernel = true

# The reciprocal square root, which normalisation layers use constantly. Written as a division
# rather than rsqrt() so the zero and negative cases match what a division gives: rsqrt(0) is an
# infinity and rsqrt of a negative is a NaN either way.
[[op]]
name = "rsqrt"
aten = ["aten.rsqrt.default"]
category = "elementwise"
arity = 1
expression = "(scalar_t(1) / sqrt($0))"
kernel = true

[[op]]
name = "reciprocal"
aten = ["aten.reciprocal.default"]
category = "elementwise"
arity = 1
expression = "(scalar_t(1) / $0)"
kernel = true

